[project]
name = "ai-customer-service"
version = "0.1.0"
description = "Multi-agent AI customer service automation system"
authors = [
    {name = "Suvro Banerjee", email = "suvrobaner@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
packages = [{include = "src"}]
license = {text = "MIT"}

# Runtime dependencies. Keep this list in sync with requirements.txt - Vercel
# installs from this file, not from requirements.txt.
#
# Deliberately excluded: torch, transformers, sentence-transformers, langchain,
# langgraph, pinecone, sqlalchemy, asyncpg, redis and chromadb. Nothing in src/
# or config/ imports them, and together they pushed the serverless bundle past
# the 500 MB function limit. Provider SDKs are loaded lazily by src/llm, so only
# the configured provider's SDK is required.
dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # Document extraction
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",

    # LLM provider (Gemini)
    "google-genai>=1.0.0",

    # Vector store
    "qdrant-client>=1.7.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
# Local development: ChromaDB lets the app run with no external services.
# Install with: pip install -e ".[local]"
local = [
    "chromadb>=0.4.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "ipython>=8.20.0",
    "jupyter>=1.0.0",
]

[tool.vercel]
# main.py only launches uvicorn; the ASGI app itself lives in src/api/main.py.
entrypoint = "src.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
